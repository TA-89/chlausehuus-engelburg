name: Demo auf GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test && npm run check
      - name: Nur öffentliche Demo-Dateien bereitstellen
        run: |
          mkdir public
          cp index.html admin.html styles.css visitors.css admin.css app.js admin.js domain.js store.js planner.js calendar.js manual.js details.js special.js seasons.js tour.js tour.html public/
          cp -R assets public/assets
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
